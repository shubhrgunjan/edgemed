name: Prototype validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLCipher
        run: brew install sqlcipher
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.19
          export CFLAGS="-I$(brew --prefix sqlcipher)/include/sqlcipher"
          export LDFLAGS="-L$(brew --prefix sqlcipher)/lib -lsqlcipher"
          uv sync --frozen
      - name: Verify pinned model and native Qdrant binary
        run: |
          uv run python scripts/provision_assets.py
          .tools/qdrant --version
      - name: Full backend suite including real offline retrieval
        run: |
          uv run ruff check edgemed tests scripts
          uv run pytest -q
  linux-retrieval:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLCipher build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlcipher-dev pkg-config
      - name: Install locked dependencies
        env:
          CFLAGS: -I/usr/include/sqlcipher
          LDFLAGS: -lsqlcipher
        run: |
          python -m pip install uv==0.12.19
          uv sync --frozen
      - name: Provision verified model and native Qdrant binary
        run: |
          uv run python scripts/provision_assets.py
          .tools/qdrant --version
      - name: Full backend suite including real offline retrieval
        run: |
          uv run ruff check edgemed tests scripts
          uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run build:demo
        working-directory: frontend
      - name: Exercise built UI across workspaces and viewport sizes
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium --only-shell
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/edgemed-app-http.log 2>&1 &
          app_pid=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-demo >/tmp/edgemed-demo-http.log 2>&1 &
          demo_pid=$!
          trap 'kill "$app_pid" "$demo_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ >/dev/null
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/ >/dev/null
          EDGEMED_UI_REVIEW_URL=http://127.0.0.1:4173 \
          EDGEMED_PUBLIC_DEMO_URL=http://127.0.0.1:4174 \
          npx playwright test tests/ui-layout.spec.ts tests/visual-logging.spec.ts tests/subjects.spec.ts tests/sync-monitor.spec.ts tests/public-demo.spec.ts
