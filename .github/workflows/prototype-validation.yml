name: Prototype validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLCipher
        run: brew install sqlcipher
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.19
          export CFLAGS="-I$(brew --prefix sqlcipher)/include/sqlcipher"
          export LDFLAGS="-L$(brew --prefix sqlcipher)/lib -lsqlcipher"
          uv sync --frozen
      - name: Verify pinned model and native Qdrant binary
        run: |
          uv run python scripts/provision_assets.py
          .tools/qdrant --version
      - name: Full backend suite including real offline retrieval
        run: |
          uv run ruff check edgemed tests scripts
          uv run pytest -q
  linux-retrieval:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLCipher build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlcipher-dev pkg-config
      - name: Install locked dependencies
        env:
          CFLAGS: -I/usr/include/sqlcipher
          LDFLAGS: -lsqlcipher
        run: |
          python -m pip install uv==0.12.19
          uv sync --frozen
      - name: Provision verified model and native Qdrant binary
        run: |
          uv run python scripts/provision_assets.py
          .tools/qdrant --version
      - name: Full backend suite including real offline retrieval
        run: |
          uv run ruff check edgemed tests scripts
          uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run build:demo
        working-directory: frontend
