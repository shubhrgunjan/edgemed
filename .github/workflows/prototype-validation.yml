name: Prototype validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLCipher
        run: brew install sqlcipher
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.19
          export CFLAGS="-I$(brew --prefix sqlcipher)/include/sqlcipher"
          export LDFLAGS="-L$(brew --prefix sqlcipher)/lib -lsqlcipher"
          uv sync --frozen
      - name: Static and security regression checks
        run: |
          uv run ruff check edgemed tests scripts
          uv run pytest -q tests/test_security_and_storage.py tests/test_governance_snapshots.py tests/test_next_phase.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
