name: "Architecture Decision Proposal"
description: "Propose a new Architectural Decision Record (ADR) or modification"
title: "[ADR]: "
labels: ["architecture", "adr", "phase-0"]
body:
  - type: markdown
    attributes:
      value: "Use this template to propose architectural revisions or new design decisions for EdgeMed."
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is the technical or domain context driving this proposal?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What specific problem or tradeoff are we addressing?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options Considered
      description: List the technical alternatives and their tradeoffs.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed Decision & Consequences
      description: What is the recommended decision and its positive/negative consequences?
    validations:
      required: true
