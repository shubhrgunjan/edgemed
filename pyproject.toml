[project]
name = "edgemed-local"
version = "0.1.0"
description = "Offline synthetic clinical memory with Qdrant Edge and selective secure sync"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.54.0", "qdrant-edge-py==0.8.0",
  "fastembed==0.8.1", "sqlcipher3==0.6.2", "cryptography==50.0.1",
  "argon2-cffi==25.1.0", "httpx==0.28.1", "keyring==25.7.0",
  "qdrant-client==1.19.1", "portalocker==3.2.0"
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.9", "pip-audit==2.10.1"]
[project.scripts]
edgemed = "edgemed.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["edgemed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the cached ONNX model and native Qdrant Server"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
